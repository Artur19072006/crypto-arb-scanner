data_source_mode: mock
enabled_connectors:
  - fake
# For public live market-data testing, use:
# data_source_mode: live
# enabled_connectors:
#   - binance
#   - bybit
#   - okx
#   - bitget
max_symbols: 3
# Optional manual override when symbol_selection.mode is manual.
symbol_allowlist:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

symbol_selection:
  mode: auto
  min_volume_24h_usd: 400000
  max_volume_24h_usd: 50000000
  max_symbols: 100
  min_exchanges_required: 2
  include_symbols: []
  exclude_symbols:
    - BTCUSDT
    - ETHUSDT

market_data:
  mode: rest
  websocket:
    enabled: false
    exchanges:
      - binance
      - bybit
      - okx
      - bitget
    reconnect_seconds: 5
    stale_after_seconds: 20
    max_symbols_per_connection: 50
    connection_start_delay_seconds: 0.25
    max_reconnect_attempts: 0

fees:
  Binance:
    maker_percent: 0.02
    taker_percent: 0.05
  Bybit:
    maker_percent: 0.02
    taker_percent: 0.055
  OKX:
    maker_percent: 0.02
    taker_percent: 0.05
  Bitget:
    maker_percent: 0.02
    taker_percent: 0.06
  Gate:
    maker_percent: 0.02
    taker_percent: 0.05
  KuCoin:
    maker_percent: 0.02
    taker_percent: 0.06

filters:
  min_volume_24h_usd: 400000
  min_raw_spread: 0.10
  min_net_spread: 0.00
  enabled_exchanges:
    - Binance
    - Bybit
    - OKX
    - Bitget
  blacklist:
    symbols: []
    exchanges: []

depth_check:
  enabled: false
  target_notional_usd: 1000
  max_opportunities_to_check: 10
  order_book_limit: 50
  max_allowed_slippage_percent: 0.3

alerts:
  enabled: false
  min_net_spread_percent: 0.15
  min_depth_adjusted_net_spread_percent: 0.05
  require_depth_status:
    - OK
    - Thin
  max_allowed_slippage_percent: 0.3
  min_volume_24h_usd: 400000
  cooldown_seconds: 300
  max_alerts_per_scan: 5

telegram:
  enabled: false
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID
  parse_mode: HTML
  timeout_seconds: 10
